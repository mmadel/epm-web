name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Consumed by ticket F-01's build-time environment check. It is declared here,
  # one ticket early, so that `main` does not go red the moment F-01 merges.
  EPM_API_BASE_URL: https://api.epm.invalid

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint + Stylelint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Custom ESLint rule tests
        run: npm run test:lint-rules

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The root tsconfig maps `api-client`, `core` and `ui` to ./dist/<name>,
      # so the libraries must be built before the applications that consume
      # them. Order matters; this stays a single job on purpose.
      - name: Build all projects (libraries first)
        run: |
          for project in api-client core ui staff patient; do
            echo "::group::Building $project"
            echo "==> Building $project"
            npx ng build "$project"
            echo "::endgroup::"
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests for every project
        run: |
          for project in api-client core ui staff patient; do
            echo "::group::Testing $project"
            echo "==> Testing $project"
            npx ng test "$project" --no-watch
            echo "::endgroup::"
          done
