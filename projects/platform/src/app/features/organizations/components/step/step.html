<div class="step" [class]="'step step--' + state()" [class.step--open]="open()">
  <h2 class="step__heading">
    <button
      class="step__toggle"
      type="button"
      [id]="headingId()"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="panelId()"
      [attr.aria-disabled]="locked() ? 'true' : null"
      (click)="onToggle()"
    >
      <!--
        The marker carries the state in a shape as well as a colour: a tick for a
        finished step, its number otherwise. A state told in colour alone is the
        one a colour-blind reader does not get.
      -->
      <span class="step__marker" aria-hidden="true">
        @if (state() === 'done') {
          <svg viewBox="0 0 12 12" focusable="false">
            <path
              d="M2.5 6.3 4.8 8.6 9.5 3.9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        } @else {
          {{ number() }}
        }
      </span>

      <span class="step__title">{{ title() }}</span>

      @if (summary()) {
        <span class="step__summary">{{ summary() }}</span>
      }

      <!--
        The affordance a finished step needs, and the reason the whole heading is
        the button rather than this being a separate link: two controls on one row
        that do the same thing is one control too many.
      -->
      @if (state() === 'done' && !open()) {
        <span class="step__edit" aria-hidden="true">
          <svg viewBox="0 0 14 14" focusable="false">
            <path
              d="M9.4 2.4 11.6 4.6M2.5 11.5l.5-2.2 6.1-6.1a1 1 0 0 1 1.4 0l.8.8a1 1 0 0 1 0 1.4l-6.1 6.1z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Edit
        </span>
      }
    </button>
  </h2>

  <!--
    `tabindex="-1"` so the page can move focus here when a step opens. Without it
    the browser refuses and focus stays on the button that was pressed, which on
    Continue is a button at the bottom of the step you just left.
  -->
  @if (open()) {
    <div class="step__panel" [id]="panelId()" [attr.aria-labelledby]="headingId()" tabindex="-1">
      <ng-content />
    </div>
  }
</div>
