<div class="entry-form">
  <div class="entry-form__fields">
    <div class="field">
      <label class="field__label" for="branch-form-name">Branch name</label>
      <div class="field__box">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" focusable="false">
            <path
              d="M8 14.2c2.8-3 4.2-5.3 4.2-7.1a4.2 4.2 0 1 0-8.4 0c0 1.8 1.4 4.1 4.2 7.1Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linejoin="round"
            />
            <circle cx="8" cy="7" r="1.5" fill="none" stroke="currentColor" stroke-width="1.3" />
          </svg>
        </span>
        <input
          class="field__control field__control--iconed"
          id="branch-form-name"
          type="text"
          autocomplete="off"
          placeholder="Maadi"
          [value]="name()"
          (input)="onName($event)"
        />
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="branch-form-phone">
        Phone <span class="field__optional">optional</span>
      </label>
      <div class="field__box">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" focusable="false">
            <path
              d="M5.8 2.7 7.1 5 5.8 6.8c.6 1.5 1.9 2.8 3.4 3.4L11 8.9l2.3 1.3v2.2c0 .6-.5 1.1-1.1 1-5-.4-8-3.4-8.4-8.4a1 1 0 0 1 1-1.1Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <input
          class="field__control field__control--iconed"
          id="branch-form-phone"
          type="tel"
          autocomplete="off"
          placeholder="+20 100 000 0000"
          [value]="phone()"
          (input)="onPhone($event)"
        />
      </div>
    </div>
  </div>

  <div class="entry-form__actions">
    <button class="entry-form__submit" type="button" [disabled]="!canSubmit()" (click)="onSubmit()">
      {{ submitLabel() }}
    </button>
    <button class="entry-form__cancel" type="button" (click)="cancelled.emit()">Cancel</button>
  </div>
</div>
