<!--
  THE TRIGGER SAYS THE GROUP AND WHAT IT IS SET TO, in two weights: the group name
  is the quiet half, because after the first read it is the ANSWER the eye is
  looking for. `Status: Active` rather than `Status`.
-->
<button
  class="menu__trigger"
  type="button"
  [class.menu__trigger--on]="count() > 0"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="true"
  (click)="toggle()"
>
  <span class="menu__group">{{ label() }}</span>
  <span class="menu__summary">{{ summary() }}</span>

  @if (count() > 1) {
    <span class="menu__count figure">{{ count() }}</span>
  }

  <span class="menu__mark" aria-hidden="true" [class.menu__mark--open]="isOpen()">
    <svg viewBox="0 0 16 16" focusable="false">
      <path
        d="m4 6.5 4 4 4-4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </span>
</button>

@if (isOpen()) {
  <!--
    IN THE FLOW OF THE BAND RATHER THAN FLOATING OVER THE LIST is not an option
    here - a menu that pushed the board down every time it opened would move the
    rows out from under the pointer - so this one is absolutely positioned. It is
    the only thing in this console that overlaps anything, and it earns it by being
    small, dismissible three ways, and directly under the control it belongs to.
  -->
  <div class="menu__list" role="group" [attr.aria-label]="label()">
    <!--
      THE WAY OUT IS THE FIRST THING IN IT. A group that can only be un-set by
      finding and un-ticking each option is a group people leave set.
    -->
    <button
      class="menu__any"
      type="button"
      [class.menu__any--on]="count() === 0"
      (click)="cleared.emit()"
    >
      {{ anyLabel() }}
      @if (anyCount() !== undefined) {
        <span class="menu__option-count figure">{{ anyCount() }}</span>
      }
    </button>

    @for (option of options(); track option.value) {
      <label
        class="menu__option"
        [class.menu__option--on]="option.isOn"
        [class.menu__option--empty]="option.count === 0 && !option.isOn"
      >
        <input
          class="visually-hidden"
          [type]="isMultiple() ? 'checkbox' : 'radio'"
          [name]="label()"
          [checked]="option.isOn"
          [disabled]="option.count === 0 && !option.isOn"
          (change)="chose.emit(option.value)"
        />

        <span class="menu__tick" aria-hidden="true">
          <svg viewBox="0 0 12 12" focusable="false">
            <path
              d="M2.6 6.2 4.8 8.4 9.4 3.8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <span class="menu__option-label">{{ option.label }}</span>

        <!--
          HOW MANY THIS OPTION WOULD LEAVE, counted with this group lifted and every
          other one still applied. It is the reason this is a menu of its own rather
          than a `select`, and the reason a reader can answer "how many are
          suspended" without filtering at all.
        -->
        <span class="menu__option-count figure">{{ option.count }}</span>
      </label>
    }

    @if (options().length === 0) {
      <p class="menu__none">Nothing to choose from here.</p>
    }
  </div>
}
