<div class="page-header">
  <div class="page-header__text">
    <!--
      `tabindex="-1"` so the frame can move focus here on every completed
      navigation. Without it the browser silently refuses and focus stays
      wherever the last click left it.
    -->
    <h1 class="page-header__title" tabindex="-1">{{ title() }}</h1>

    @if (subtitle()) {
      <p class="page-header__subtitle">{{ subtitle() }}</p>
    }
  </div>

  <!-- At most one action, and never the screen's primary one. -->
  <div class="page-header__action">
    <ng-content />
  </div>
</div>
