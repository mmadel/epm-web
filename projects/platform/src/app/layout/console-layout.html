<lib-shell skipLinkLabel="Skip to main content">
  <!--
    The environment edge. Staging and production carry it, and so does an
    environment the build did not name; local and development do not, because
    they announce themselves through the data in them. It is decorative - the
    chip below is what says which environment this is - so it is hidden rather
    than announced as an empty region.

    The element is always here and the tone class is what gives it a height,
    rather than the element being wrapped in an `@if`: content inside a
    control-flow block at the root of projected content does not carry the
    block's own attributes into slot matching, so an `@if` here would quietly
    drop the strip into the default slot and render it inside the content area.
  -->
  <div shell-edge [class]="edgeClass" aria-hidden="true"></div>

  <!--
    THE WORDMARK IS THE ROUTE HOME. With no navigation band it is the only one, so
    it is a link with an accessible name and not a decoration.

    It is `ui`'s and no longer this console's. The mark it draws is the product's
    rather than either console's, and it was drawn twice - identically, because the
    staff console's copy was taken from this one - which meant changing it changed
    half of it. See T-100.
  -->
  <lib-wordmark shell-brand product="EPM" consoleName="Platform" [link]="homeLink" />

  <div shell-header-end class="console-account-area">
    <app-environment-chip />

    <!--
      No menu behind the account. Sign-out belongs with auth, and auth is
      blocked on the token and realm decisions (P-02.4); a menu with one
      disabled item in it is worse than no menu. The full name is the title,
      the initials are the mark, and the mark is not a control.
    -->
    <span class="console-account" [title]="accountName">
      <span class="visually-hidden">Signed in as</span>
      <span class="console-account__initials" aria-hidden="true">{{ accountInitials }}</span>
      <span class="visually-hidden">{{ accountName }}</span>
    </span>
  </div>

  <!--
    Announced politely on every completed navigation, because moving focus to a
    heading is not by itself something every screen reader reads out. It is
    empty on first render so the landing page is not announced on top of the
    page load.
  -->
  <div class="visually-hidden" aria-live="polite">{{ announcement() }}</div>

  <ng-content />
</lib-shell>
