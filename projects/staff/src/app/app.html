<lib-shell [navigation]="navigation">
  <router-outlet />

  <!--
    There are no screens yet: this console's route table is empty until the first
    feature ticket adds one, so the content area would otherwise be blank with no
    explanation. The condition is read from the route table itself, so this
    disappears on its own rather than becoming something to remember to delete.
  -->
  @if (!hasScreens) {
    <p>{{ 'common.state.empty' | translate }}</p>
  }
</lib-shell>
