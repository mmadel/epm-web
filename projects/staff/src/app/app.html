<lib-shell [skipLinkLabel]="'shell.header.skip-to-content' | translate" [navigation]="navigation()">
  <!--
    THE WORDMARK SAYS WHICH CONSOLE THIS IS, and it is the link home. A person can
    hold an account in this console and in the platform one, and the two run under
    opposite tenancy rules, so "which application am I in" has to be answerable
    without reading the address bar.
  -->
  <lib-wordmark
    shell-brand
    [product]="'shell.header.title' | translate"
    [consoleName]="'shell.header.console' | translate"
    [link]="home"
  />

  <lib-language-switch shell-header-end />

  <!--
    The frame no longer pads its content region - a product that wants a
    full-bleed band at the top of a screen cannot get one back out of a padded
    frame - so this console's gutter lives here.
  -->
  <div class="staff-content">
    <router-outlet />
  </div>
</lib-shell>
