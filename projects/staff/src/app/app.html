<!--
  NO `navigation` INPUT, so the frame renders no navigation landmark at all - see
  `App` for why this console has none. It is not the same as passing an empty list,
  which would render a landmark that announces itself and contains nothing.
-->
<lib-shell [skipLinkLabel]="'shell.header.skip-to-content' | translate">
  <!--
    THE WORDMARK SAYS WHICH CONSOLE THIS IS, and it is the route home. A person can
    hold an account in this console and in the platform one, and the two run under
    opposite tenancy rules, so "which application am I in" has to be answerable
    without reading the address bar - and with no rail beside the content, this is
    also the only way back to the home screen.
  -->
  <lib-wordmark
    shell-brand
    [product]="'shell.header.title' | translate"
    [consoleName]="'shell.header.console' | translate"
    [link]="home"
  />

  <lib-language-switch shell-header-end />

  <!--
    The frame does not pad its content region - a product that wants a full-bleed
    band at the top of a screen cannot get one back out of a padded frame - so this
    console's gutter lives here.
  -->
  <div class="staff-content">
    @if (loading()) {
      <lib-placeholder
        [heading]="'common.state.loading' | translate"
        [body]="'common.state.loading-section' | translate"
      />
    }

    <!--
      THE OUTLET IS HIDDEN RATHER THAN DESTROYED while a chunk is in flight. Putting
      it behind an `@else` would tear it down mid-navigation and leave the router
      with nowhere to activate the screen it has just finished fetching; hiding it
      keeps the outlet registered and only takes the previous screen off the page.
    -->
    <div class="staff-outlet" [class.staff-outlet--waiting]="loading()">
      <router-outlet />
    </div>
  </div>
</lib-shell>
