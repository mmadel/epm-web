<!--
  One link around the mark and both words. They are one object: read together they
  say which application is open, and a target covering only part of what looks like
  a single thing is a target people miss.
-->
<a class="wordmark" [routerLink]="link()">
  <span class="wordmark__mark" aria-hidden="true">
    <!--
      A pulse trace: the product's mark, and the same one the platform console draws
      in its own header. Decorative here - the words beside it are the name - so it
      is hidden from the accessible name rather than described twice.
    -->
    <svg viewBox="0 0 16 16" focusable="false">
      <path
        d="M1.5 8.5h2.7l1.4-4 2.2 7 1.6-4.4 1 1.4h4.1"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </span>

  <!--
    `&ngsp;` and not a plain space: Angular strips whitespace-only text nodes
    between elements, and the accessible name would then run the two words together.
    The gap is content here, not layout.
  -->
  <span class="wordmark__name"
    ><span class="wordmark__product">{{ product() }}</span
    >&ngsp;<span class="wordmark__console">{{ consoleName() }}</span></span
  >
</a>
